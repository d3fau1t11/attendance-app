kind = "mobile"
previewPath = "/"
title = "Attendance Mobile"
description = "An Android-first employee attendance app for secure workplace QR check-in, geofence-aware attendance status, offline event sync, and personal attendance history backed by Supabase."
version = "1.0.0"
id = "artifacts/attendance-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25272

[services.development]
run = "pnpm --filter @workspace/attendance-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attendance-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/attendance-mobile", "run", "serve" ]

[services.env]
PORT = "25272"
BASE_PATH = "/"
