[build]
  command = "pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/attendance-web run build"
  functions = "netlify/functions"
  publish = "artifacts/attendance-web/dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

